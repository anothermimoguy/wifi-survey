<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wi-Fi Survey Map</title>
<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
<style>html,body,#map{height:100%;margin:0}#panel{position:absolute;z-index:2;top:12px;left:12px;background:#fff;padding:12px;border-radius:10px;box-shadow:0 2px 12px #0003;font:14px system-ui;max-width:330px}select{padding:4px}#legend{margin-top:8px}.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px}</style></head>
<body><div id="map"></div><div id="panel"><b>Wi-Fi Survey</b><br>Measurements: 4<br>
<label>Colour by <select id="metric"><option>RSSI</option><option>SNR</option><option>RX Rate</option><option>TX Rate</option></select></label><br><label>Heatmap radius <input id="radius" type="range" min="5" max="80" value="25"> <span id="radiusValue">25 m</span> <small style="color:#666">(20 dB predicted edge fall-off)</small></label><br><label><input id="heatmap" type="checkbox" checked> Predictive heatmap</label>
<div id="legend"></div><small>Coordinates are plotted directly from Latitude/Longitude in the CSV.</small></div>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script>
const data=[{"Measurement ID": "20260923-215252", "Timestamp": "2026-09-23 21:52:52", "Latitude": "51.41414020928617", "Longitude": "-0.0624469340391407", "SSID": "RemoteJ-5", "BSSID": "4c:23:1a:d5:2b:e6", "WiFi Standard": "802.11ax", "WiFi Generation": "Wi-Fi 6", "Band": "5 GHz", "Channel": "124", "RSSI": "-56", "Noise": "-97", "SNR": "41", "RX Rate": "433", "TX Rate": "344", "Local IP": "192.168.2.36", "Public IP": "87.74.180.162", "Device": "iPhone", "iOS Version": "27.0", "_lat": 51.41414020928617, "_lon": -0.0624469340391407, "RSSI_num": -56.0, "Noise_num": -97.0, "SNR_num": 41.0, "RX Rate_num": 433.0, "TX Rate_num": 344.0}, {"Measurement ID": "20260923-215307", "Timestamp": "2026-09-23 21:53:07", "Latitude": "51.41414020928617", "Longitude": "-0.0624469340391407", "SSID": "RemoteJ-5", "BSSID": "4c:23:1a:d5:2b:e6", "WiFi Standard": "802.11ax", "WiFi Generation": "Wi-Fi 6", "Band": "5 GHz", "Channel": "124", "RSSI": "-60", "Noise": "-97", "SNR": "37", "RX Rate": "516", "TX Rate": "344", "Local IP": "192.168.2.36", "Public IP": "87.74.180.162", "Device": "iPhone", "iOS Version": "27.0", "_lat": 51.41414020928617, "_lon": -0.0624469340391407, "RSSI_num": -60.0, "Noise_num": -97.0, "SNR_num": 37.0, "RX Rate_num": 516.0, "TX Rate_num": 344.0}, {"Measurement ID": "20260923-215314", "Timestamp": "2026-09-23 21:53:14", "Latitude": "51.41414422441684", "Longitude": "-0.0624678817688337", "SSID": "RemoteJ-5", "BSSID": "4c:23:1a:d5:2b:e6", "WiFi Standard": "802.11ax", "WiFi Generation": "Wi-Fi 6", "Band": "5 GHz", "Channel": "124", "RSSI": "-54", "Noise": "-97", "SNR": "43", "RX Rate": "487", "TX Rate": "344", "Local IP": "192.168.2.36", "Public IP": "87.74.180.162", "Device": "iPhone", "iOS Version": "27.0", "_lat": 51.41414422441684, "_lon": -0.0624678817688337, "RSSI_num": -54.0, "Noise_num": -97.0, "SNR_num": 43.0, "RX Rate_num": 487.0, "TX Rate_num": 344.0}, {"Measurement ID": "20260923-215318", "Timestamp": "2026-09-23 21:53:18", "Latitude": "51.41414422441684", "Longitude": "-0.0624678817688337", "SSID": "RemoteJ-5", "BSSID": "4c:23:1a:d5:2b:e6", "WiFi Standard": "802.11ax", "WiFi Generation": "Wi-Fi 6", "Band": "5 GHz", "Channel": "124", "RSSI": "-55", "Noise": "-96", "SNR": "41", "RX Rate": "573", "TX Rate": "458", "Local IP": "192.168.2.36", "Public IP": "87.74.180.162", "Device": "iPhone", "iOS Version": "27.0", "_lat": 51.41414422441684, "_lon": -0.0624678817688337, "RSSI_num": -55.0, "Noise_num": -96.0, "SNR_num": 41.0, "RX Rate_num": 573.0, "TX Rate_num": 458.0}];
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[-0.0624574079039872,51.4141422168515],zoom:18});
map.addControl(new maplibregl.NavigationControl());
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function color(metric,v){if(v==null||!isFinite(v))return '#777';if(metric==='RSSI')return v>=-60?'#2ca02c':v>=-67?'#8bc34a':v>=-72?'#f1c40f':v>=-77?'#e67e22':'#d62728';if(metric==='SNR')return v>=30?'#2ca02c':v>=20?'#8bc34a':v>=15?'#f1c40f':v>=10?'#e67e22':'#d62728';let vals=data.map(x=>x[metric+'_num']).filter(x=>x!=null),min=Math.min(...vals),max=Math.max(...vals),t=max===min?1:(v-min)/(max-min);return t>=.75?'#2ca02c':t>=.5?'#8bc34a':t>=.25?'#f1c40f':'#d62728';}
function render(){document.querySelectorAll('.survey-marker').forEach(e=>e.remove());let metric=document.getElementById('metric').value;data.forEach(d=>{let el=document.createElement('div');el.className='survey-marker';el.style.cssText=`width:16px;height:16px;border-radius:50%;background:${color(metric,d[metric+'_num'])};border:2px solid #222;box-sizing:border-box;cursor:pointer`;new maplibregl.Marker({element:el}).setLngLat([d._lon,d._lat]).setPopup(new maplibregl.Popup().setHTML('<b>Wi-Fi Measurement</b><br>'+['Measurement ID','Timestamp','SSID','BSSID','WiFi Standard','WiFi Generation','Band','Channel','RSSI','Noise','SNR','RX Rate','TX Rate','Local IP','Public IP','Device','iOS Version'].map(f=>d[f]!=null?'<b>'+esc(f)+'</b>: '+esc(d[f])+'<br>':'').join(''))).addTo(map);});document.getElementById('legend').innerHTML=metric==='RSSI'?'🟢 ≥-60 &nbsp; 🟢 -61–-67 &nbsp; 🟡 -68–-72 &nbsp; 🟠 -73–-77 &nbsp; 🔴 <-77':metric==='SNR'?'🟢 ≥30 &nbsp; 🟢 20–29 &nbsp; 🟡 15–19 &nbsp; 🟠 10–14 &nbsp; 🔴 <10':'🟢 Higher → 🔴 Lower';}
map.on('load',()=>{render();if(data.length>1){let b=new maplibregl.LngLatBounds();data.forEach(d=>b.extend([d._lon,d._lat]));map.fitBounds(b,{padding:80,maxZoom:19});}});
document.getElementById('metric').onchange=render;
</script>
<style>
#heatCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#map .maplibregl-marker{z-index:2}
</style>
<canvas id="heatCanvas"></canvas>
<script>
(function(){
 const canvas=document.getElementById('heatCanvas'),ctx=canvas.getContext('2d');
 const radiusEl=document.getElementById('radius'),radiusValue=document.getElementById('radiusValue'),heatEl=document.getElementById('heatmap');
 let raf=0;
 function resize(){const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);drawHeat();}
 function metersToPixels(m){const c=map.getCenter(),a=map.project(c),b=map.project([c.lng+ (m/(111320*Math.cos(c.lat*Math.PI/180))),c.lat]);return Math.max(2,Math.abs(b.x-a.x));}
 function valueAt(x,y,metric,rpx){
   let num=0,den=0,has=false;
   for(const p of data){
     const v=Number(p[metric+'_num']);
     if(!Number.isFinite(v))continue;
     const q=map.project([p._lon,p._lat]);
     const d=Math.hypot(x-q.x,y-q.y);
     if(d>rpx)continue;
     has=true;
     if(d<1)return v;
     const t=Math.min(1,d/rpx);
     // Predictive fall-off: the farther from measured data, the weaker the predicted RSSI.
     // At the edge of the selected radius, apply a 20 dB penalty.
     const attenuation = metric==='RSSI' ? 20*Math.pow(t,1.35) : 0;
     const predicted = v - attenuation;
     const w=1/(d*d);
     num+=w*predicted;
     den+=w;
   }
   return has && den ? num/den : null;
 }
 function rgbaFor(v,metric,alpha){if(v==null)return null;if(metric==='RSSI'){
   // Continuous green -> yellow -> orange -> red scale.
   const t=Math.max(0,Math.min(1,(-v-45)/45));
   let r,g,b;
   if(t<0.5){
     const u=t/0.5; r=Math.round(40+(245-40)*u); g=Math.round(190+(210-190)*u); b=Math.round(80+(55-80)*u);
   }else{
     const u=(t-0.5)/0.5; r=Math.round(245+(215-245)*u); g=Math.round(210+(45-210)*u); b=Math.round(55+(45-55)*u);
   }
   return `rgba(${r},${g},${b},${alpha})`;
 }if(metric==='SNR'){if(v>=30)return `rgba(40,190,80,${alpha})`;if(v>=20)return `rgba(130,205,75,${alpha})`;if(v>=15)return `rgba(245,210,55,${alpha})`;if(v>=10)return `rgba(240,130,35,${alpha})`;return `rgba(215,45,45,${alpha})`;}const vals=data.map(d=>Number(d[metric+'_num'])).filter(Number.isFinite);const mn=Math.min(...vals),mx=Math.max(...vals),t=mx===mn?.5:(v-mn)/(mx-mn);if(t>=.75)return `rgba(40,190,80,${alpha})`;if(t>=.5)return `rgba(130,205,75,${alpha})`;if(t>=.25)return `rgba(245,210,55,${alpha})`;return `rgba(215,45,45,${alpha})`;}
 function drawHeat(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);if(!heatEl.checked||!data.length)return;const metric=document.getElementById('metric').value,rpx=metersToPixels(Number(radiusEl.value)),step=4,w=canvas.clientWidth,h=canvas.clientHeight;for(let y=0;y<h;y+=step){for(let x=0;x<w;x+=step){const v=valueAt(x+step/2,y+step/2,metric,rpx);if(v==null)continue;let near=1e9;for(const p of data){const q=map.project([p._lon,p._lat]);near=Math.min(near,Math.hypot(x+step/2-q.x,y+step/2-q.y));}const edge=Math.max(0,1-near/rpx);const alpha=.08+.30*edge*edge;const c=rgbaFor(v,metric,alpha);if(c){ctx.fillStyle=c;ctx.fillRect(x,y,step,step);}}}});}
 radiusEl.addEventListener('input',()=>{radiusValue.textContent=radiusEl.value+' m';drawHeat();});heatEl.addEventListener('change',drawHeat);document.getElementById('metric').addEventListener('change',drawHeat);
 map.on('load',drawHeat);map.on('move',drawHeat);map.on('resize',resize);window.addEventListener('resize',resize);resize();
})();
</script>
</body></html>
